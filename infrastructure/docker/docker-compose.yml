services:
  web:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - api

  admin:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.admin
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - api

  super-admin:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.super-admin
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - api

  api:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.api
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - API_PORT=4000
      - API_HOST=0.0.0.0

  worker:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.worker
    environment:
      - NODE_ENV=production
      - WORKER_CONCURRENCY=5
    depends_on:
      - api
